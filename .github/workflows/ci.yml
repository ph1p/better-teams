name: ci

# Also called by release.yml, so a release only happens after this full gate.
# Pushes to main are covered by that call; the rest run here.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run fmt:check
      - run: pnpm run --if-present test
      - run: pnpm run build
      - run: node ../scripts/build-host-patch.ts dist/better-teams-app.js dist/better-teams-host.js
      - name: shell scripts parse
        run: for f in ../better-teams ../install.sh ../uninstall.sh ../scripts/package-release.sh; do bash -n "$f"; done
