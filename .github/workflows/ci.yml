name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node ../scripts/build-host-patch.mjs dist/teams-calm-app.js dist/teams-calm-host.js
      - name: shell scripts parse
        run: for f in ../teams-calm ../install.sh ../uninstall.sh; do bash -n "$f"; done
