name: release

# semantic-release: every push to main is analyzed; feat/fix/perf commits (or a
# BREAKING CHANGE) publish a new version with the prebuilt overlay that
# install.sh downloads. The version bump is committed back to app/package.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The full CI gate (lint, format, tests, host-patch build) must pass first.
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm run typecheck && pnpm run build
        working-directory: app
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          npx --yes
          -p semantic-release@24.2.3
          -p @semantic-release/exec@6.0.3
          -p @semantic-release/git@10.0.1
          semantic-release
      - name: attest release tarball
        if: hashFiles('release/better-teams.tar.gz') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/better-teams.tar.gz
