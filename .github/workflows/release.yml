name: release

# Push a tag like v0.2.0 (matching app/package.json) to publish a release with
# the prebuilt overlay that install.sh downloads.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: tag matches package version
        run: |
          v="$(node -p 'require("./app/package.json").version')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != app/package.json v$v"; exit 1; }
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm run typecheck && pnpm run build
        working-directory: app
      - name: package
        run: |
          mkdir pkg
          node scripts/build-host-patch.ts app/dist/better-teams-app.js pkg/better-teams-host.js
          cp better-teams LICENSE pkg/
          chmod +x pkg/better-teams
          echo "${GITHUB_REF_NAME#v}" > pkg/VERSION
          tar -czf better-teams.tar.gz -C pkg .
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" better-teams.tar.gz install.sh --title "$GITHUB_REF_NAME" --generate-notes
